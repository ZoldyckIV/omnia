<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تهنئة خطوبة أمنية 💍</title>
  
  <!-- Google Fonts: El Messiri, Aref Ruqaa, Alexandria & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@500;600;700&family=Marhey:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floral Background Accents from the reference picture -->
  <div class="floral-frame floral-top-left" aria-hidden="true">
    <img src="assets/floral_corner.jpg" alt="" class="floral-img">
  </div>
  <div class="floral-frame floral-bottom-right" aria-hidden="true">
    <img src="assets/floral_corner.jpg" alt="" class="floral-img">
  </div>

  <main class="page-container">
    
    <!-- Invitation Card Container -->
    <div class="card-outer">
      <div class="card-inner">
        
        <!-- Wax Seal Badge -->
        <div class="wax-seal-wrapper">
          <img src="assets/wax_seal.jpg" alt="ختم شمعي" class="wax-seal-img">
        </div>

        <!-- Header -->
        <header class="card-header">
          <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
          <p class="hadith">" بَارَكَ اللَّهُ لَكُمَا وَبَارَكَ عَلَيْكُمَا وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ "</p>
          <div class="divider"><span>✦</span></div>
          <h1 class="main-title">ألف مبروك الخطوبة</h1>
          <h2 class="bride-name">أُمنية</h2>
          <p class="subtitle">شاركونا أجمل التهاني والدعوات للعروس 🤍</p>
        </header>

        <!-- Form: Name & Congratulation Message Only -->
        <form id="congratsForm" class="congrats-form">
          <div class="form-group">
            <label for="senderName">الاسم:</label>
            <input 
              type="text" 
              id="senderName" 
              placeholder="اكتب اسمك هنا..." 
              required 
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="senderMessage">رسالة التهنئة:</label>
            <textarea 
              id="senderMessage" 
              rows="4" 
              placeholder="اكتب تهنئتك ودعواتك للعروس..." 
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span>إرسال التهنئة</span>
            <span>💌</span>
          </button>
        </form>

        <!-- Stored Wishes Section -->
        <section class="messages-section">
          <div class="section-title-wrap">
            <h3 class="messages-title">التهاني والمباركات (<span id="msgCount">0</span>)</h3>
          </div>

          <div id="messagesList" class="messages-list">
            <!-- Only real saved messages appear here -->
          </div>
        </section>

      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
